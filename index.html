<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hugo Iteney – Ingénieur de recherche</title>
<meta name="description" content="Hugo Iteney – Ingénieur de recherche en mécanique des structures, matériaux et développement numérique. CV et contact.">
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #15202b;
    --muted: #5b6876;
    --accent: #12406b;
    --accent-text: #ffffff;
    --border: #d9dee4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1419;
      --card: #182028;
      --text: #e8edf2;
      --muted: #9aa7b4;
      --accent: #6fb1ea;
      --accent-text: #0f1419;
      --border: #2b3742;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
  }
  main {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 28px 28px;
    text-align: center;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 1.9rem;
    letter-spacing: -0.01em;
  }
  .title {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 1rem;
  }
  a.btn {
    display: block;
    margin-top: 12px;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 1rem;
  }
  a.btn:hover, a.btn:focus-visible { border-color: var(--accent); }
  a.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
    font-size: 1.05rem;
  }
  a.btn.primary:hover, a.btn.primary:focus-visible { opacity: 0.9; }
  .mail {
    margin: 22px 0 0;
    font-size: 0.9rem;
    color: var(--muted);
    word-break: break-all;
  }
</style>
</head>
<body>
<main>
  <h1>Hugo Iteney</h1>
  <p class="title">Ingénieur de recherche en mécanique des structures, matériaux et développement numérique</p>

  <a class="btn primary" href="cv.pdf">Voir mon CV (PDF)</a>
  <a class="btn" href="mailto:hugo.iteney@gmail.com">M'écrire</a>
  <a class="btn" href="https://www.linkedin.com/in/hugo-iteney/" target="_blank" rel="noopener">LinkedIn</a>
  <a class="btn" href="https://scholar.google.com/citations?user=z8cTV6MAAAAJ&amp;hl=fr" target="_blank" rel="noopener">Google Scholar</a>

  <p class="mail">hugo.iteney@gmail.com</p>
</main>
</body>
</html>
